name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|build)(\(.+\))?!?: .+' \
            || { echo "::error::The PR title must be a Conventional Commit, such as 'feat: every rate cell states its unit'"; exit 1; }

  # verify:
  #   Added by the issue "Add a verify command and run it in CI".
  #   It runs the verify command from docs/agents/coding-standards.md.
