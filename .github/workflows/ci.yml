name: CI

# No `edited` trigger. A skipped job counts as a passing required check, so a title edit
# that skipped verify would replace a red verify with a green one.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push cancels the last push's run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
